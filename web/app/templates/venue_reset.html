{% extends "base.html" %}
{% block title %}New venue password · {{ APP_NAME }}{% endblock %}
{% block content %}
<section class="auth">
  <h1>Choose a new password</h1>
  {% if error %}<div class="notice error" role="alert">{{ error }}</div>{% endif %}
  <form method="post" action="/venue/reset/{{ token }}">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>New password <span class="muted">(10+ characters)</span> <input type="password" name="password" required minlength="10" maxlength="128" autocomplete="new-password"></label>
    <button class="btn wide">Change password</button>
  </form>
</section>
{% endblock %}
