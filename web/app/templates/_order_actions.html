{# expects: o (order dict), and optionally next_url #}
<div class="actions">
  {% for nxt in ALLOWED[o.status] if nxt != "declined" %}
  <form method="post" action="/panel/orders/{{ o.id }}/status" class="inline">
<input type="hidden" name="csrf" value="{{ csrf }}">
    <input type="hidden" name="status" value="{{ nxt }}">
    <input type="hidden" name="next" value="{{ next_url or '/panel' }}">
    <button class="btn {{ 'ghost' if nxt == 'no_show' else '' }}">{{ ACTION_LABELS[nxt] }}</button>
  </form>
  {% endfor %}
  {% if o.status in ALLOWED %}
  <form method="post" action="/panel/orders/{{ o.id }}/status" class="inline decline">
<input type="hidden" name="csrf" value="{{ csrf }}">
    <input type="hidden" name="status" value="declined">
    <input type="hidden" name="next" value="{{ next_url or '/panel' }}">
    <input name="reason" placeholder="Reason for declining" maxlength="200" required aria-label="Reason for declining">
    <button class="btn danger">Decline</button>
  </form>
  {% endif %}
</div>
